# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard

services:
  devboard-integrations:
    build:
      context: .
    container_name: devboard-integrations
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_HOST: devboard-redis
    ports:
      - "8005:8000"
    networks:
      - devboard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  devboard-integrations-worker:
    build:
      context: .
    container_name: devboard-integrations-worker
    depends_on:
      devboard-integrations:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_HOST: devboard-redis
    command: python -m app.consumer.worker
    networks:
      - devboard-network
networks:
  devboard-network:
    name: devboard-network
    external: true
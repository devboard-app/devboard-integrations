services:
  devboard-integrations:
    build:
      context: .
    container_name: devboard-integrations
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_HOST: devboard-redis
    ports:
      - "8005:8000"
    networks:
      - devboard-network

networks:
  devboard-network:
    external: true